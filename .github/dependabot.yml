# Keeps the pinned GitHub Actions and NuGet packages current. Each ecosystem's minor and patch
# updates of a week arrive as one pull request; a major update still gets its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        update-types: [minor, patch]
