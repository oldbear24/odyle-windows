name: Windows release
# Every push to main that changes more than documentation publishes a GitHub release.
# Manual runs (any branch) only run the checks and keep the packages as artifacts.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'THIRD-PARTY.md'
  workflow_dispatch:
permissions:
  contents: read
# Releases run one at a time; a newer push replaces a release still waiting to start.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Project version plus the run number, e.g. 0.5.0.12; bump <Version> in the project for a new line.
      - id: version
        run: |
          $base = (Select-Xml -Path src/Odyle.Reader/Odyle.Reader.csproj -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1).Node.InnerText
          if (!$base) { throw 'Odyle.Reader.csproj has no <Version>.' }
          "version=$base.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
      - run: dotnet build src/Odyle.Reader/Odyle.Reader.csproj -c Release
      - run: dotnet run --project tests/Odyle.Core.Checks -c Release
      - run: dotnet run --project tests/Odyle.Reader.Checks -c Release
      # x64 and ARM64, small and self-contained; the per-user installer wraps the self-contained x64 build.
      - run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.version }}
      - run: ./scripts/publish.ps1 -SelfContained -Installer -Version ${{ steps.version.outputs.version }}
      - run: ./scripts/publish.ps1 -Runtime win-arm64 -Version ${{ steps.version.outputs.version }}
      - run: ./scripts/publish.ps1 -Runtime win-arm64 -SelfContained -Version ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odyle-windows
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.sha256
      # Only a push to main publishes, and that release becomes the latest one installed apps update to.
      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = (Get-ChildItem artifacts/*.zip, artifacts/*.exe, artifacts/*.sha256).FullName
          gh release create "v$env:VERSION" @assets --target $env:GITHUB_SHA --title "Odyle $env:VERSION" --generate-notes --latest
