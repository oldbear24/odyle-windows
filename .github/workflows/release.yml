name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Releases run one at a time; a newer push replaces a release still waiting to start.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Project version plus the run number, e.g. 0.5.0.12; bump <Version> in the project for a new line.
      - id: version
        run: |
          $base = (Select-Xml -Path src/Odyle.Reader/Odyle.Reader.csproj -XPath '/Project/PropertyGroup/Version' | Select-Object -First 1).Node.InnerText
          if (!$base) { throw 'Odyle.Reader.csproj has no <Version>.' }
          "version=$base.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
      - run: dotnet build src/Odyle.Reader/Odyle.Reader.csproj -c Release
      - run: dotnet run --project tests/Odyle.Core.Checks -c Release
      - run: dotnet run --project tests/Odyle.Reader.Checks -c Release
      - run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.version }}
      - run: ./scripts/publish.ps1 -SelfContained -Version ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odyle-windows
          path: |
            artifacts/*.zip
            artifacts/*.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = (Get-ChildItem artifacts/*.zip, artifacts/*.sha256).FullName
          gh release create "v$env:VERSION" @assets --target $env:GITHUB_SHA --title "Odyle $env:VERSION" --generate-notes --latest
