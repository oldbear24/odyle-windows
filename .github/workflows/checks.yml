name: Windows checks
# Pushes to main run the same checks in the release workflow.
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Odyle.Reader/Odyle.Reader.csproj -c Release
      - run: dotnet run --project tests/Odyle.Core.Checks -c Release
      - run: dotnet run --project tests/Odyle.Reader.Checks -c Release
      - run: ./scripts/publish.ps1
      - run: ./scripts/publish.ps1 -SelfContained
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odyle-windows
          path: artifacts/*.zip
