name: Windows checks
# Pushes to main run the same checks in the release workflow.
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main and the release tags, for the version check
      # A change to what ships bumps <Version> (AGENTS.md, Versioning).
      - name: Version bump
        run: ./scripts/version.ps1 check -Base '${{ github.event.pull_request.base.sha }}'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Odyle.Reader/Odyle.Reader.csproj -c Release
      - run: dotnet run --project tests/Odyle.Core.Checks -c Release
      - run: dotnet run --project tests/Odyle.Reader.Checks -c Release
      # The same packages as a release, unversioned, so a broken ARM64 build or installer shows up before main.
      - run: ./scripts/publish.ps1
      - run: ./scripts/publish.ps1 -SelfContained -Installer
      - run: ./scripts/publish.ps1 -Runtime win-arm64
      - run: ./scripts/publish.ps1 -Runtime win-arm64 -SelfContained
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odyle-windows
          path: |
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.sha256
