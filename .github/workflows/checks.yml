name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Odyle.Reader/Odyle.Reader.csproj -c Release
      - run: dotnet run --project tests/Odyle.Core.Checks -c Release
      - run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: odyle-windows
          path: artifacts/*.zip
