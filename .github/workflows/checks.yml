name: Windows checks
# Pushes to main run the same checks in the release workflow.
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Odyle.Reader/Odyle.Reader.csproj -c Release
      - run: dotnet run --project tests/Odyle.Core.Checks -c Release
      - run: dotnet run --project tests/Odyle.Reader.Checks -c Release
      - run: ./scripts/publish.ps1
      - run: ./scripts/publish.ps1 -SelfContained
      - uses: actions/upload-artifact@v7
        with:
          name: odyle-windows
          path: artifacts/*.zip
